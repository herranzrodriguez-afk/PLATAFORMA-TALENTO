<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla Principal V2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  font-family: Arial;
}

.hero {
  text-align: center;
  padding: 40px;
  background: #f5f5f5;
}

.botones button {
  margin: 10px;
  padding: 12px 20px;
  font-size: 16px;
  cursor: pointer;
}

.filtros {
  padding: 20px;
  background: #fafafa;
}

.filtros input, .filtros select {
  margin: 5px;
  padding: 5px;
}

#map {
  height: 400px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Plataforma Gestión de Trabajadores</h1>

  <div class="botones">
    <button onclick="irRegistro()">Quiero inscribirme</button>
    <button>Ya soy trabajador</button>
    <button>Soy empresa</button>
  </div>
</div>

<div class="filtros">
  <h3>Filtros</h3>

  <select id="categoria">
    <option value="">Categoría profesional</option>
    <option>Camarero</option>
    <option>Cocinero</option>
    <option>Limpieza</option>
  </select>

  <input type="text" id="provincia" placeholder="Provincia">
  <input type="text" id="poblacion" placeholder="Población">

  <br><br>

  <strong>Disponibilidad semanal:</strong><br>

  <div id="disponibilidad">
    <!-- Se genera dinámicamente -->
  </div>

  <br>

  <input type="number" id="precioMin" placeholder="Precio €/h min">
  <input type="number" id="precioMax" placeholder="Precio €/h max">

  <br><br>

  <button onclick="filtrar()">Buscar</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ---------- MAPA ----------
var map = L.map('map').setView([40.4168, -3.7038], 6); // España

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
}).addTo(map);

let marcadores = [];

// ---------- DISPONIBILIDAD ----------
const dias = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const contenedor = document.getElementById("disponibilidad");

dias.forEach(dia => {
  const div = document.createElement("div");

  div.innerHTML = `
    ${dia}
    <input type="time" id="${dia}-inicio">
    <input type="time" id="${dia}-fin">
  `;

  contenedor.appendChild(div);
});

// ---------- BOTÓN BLOQUE 2 ----------
function irRegistro() {
  window.location.href = "bloque2.html"; // AJUSTAR ruta real
}

// ---------- FILTRADO ----------
function filtrar() {
  const categoria = document.getElementById("categoria").value;
  const provincia = document.getElementById("provincia").value.toLowerCase();
  const poblacion = document.getElementById("poblacion").value.toLowerCase();
  const precioMin = document.getElementById("precioMin").value;
  const precioMax = document.getElementById("precioMax").value;

  const trabajadores = JSON.parse(localStorage.getItem("trabajadores")) || [];

  // Limpiar mapa
  marcadores.forEach(m => map.removeLayer(m));
  marcadores = [];

  const resultados = trabajadores.filter(t => {
    let ok = true;

    if (categoria && t.puesto !== categoria) ok = false;
    if (provincia && !t.provincia?.toLowerCase().includes(provincia)) ok = false;
    if (poblacion && !t.poblacion?.toLowerCase().includes(poblacion)) ok = false;

    if (precioMin && t.precio < precioMin) ok = false;
    if (precioMax && t.precio > precioMax) ok = false;

    return ok;
  });

  resultados.forEach(t => {
    if (t.lat && t.lng) {
      const marker = L.marker([t.lat, t.lng])
        .addTo(map)
        .bindPopup(t.nombre);

      marcadores.push(marker);
    }
  });

  // -------- CENTRAR MAPA ----------
  if (resultados.length > 0) {
    const primero = resultados[0];

    if (primero.lat && primero.lng) {
      map.setView([primero.lat, primero.lng], 10);
    }
  }
}
</script>

</body>
</html>
