
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto Empresa Javi</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: #f5f5f5;
      margin: 0;
    }

    header {
      background-color: #222;
      color: white;
      padding: 20px;
    }

    .container {
      padding: 40px;
    }

    button {
      padding: 15px 30px;
      margin: 20px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    .empresa { background-color: #0066ff; color: white; }
    .trabajo { background-color: #00aa55; color: white; }

    form {
      display: none;
      margin-top: 30px;
    }

    input, textarea {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 300px;
    }

    .active {
      display: block;
    }
  </style>
</head>

<body>

<header>
  <h1>Proyecto Empresa Javi</h1>
  <p>Encuentra talento o trabajo en España</p>
</header>

<div class="container">

  <h2>¿Qué buscas?</h2>

  <button class="empresa" onclick="mostrar('empresa')">Soy empresa</button>
  <button class="trabajo" onclick="mostrar('trabajador')">Busco trabajo</button>

  <!-- FORM EMPRESA -->
  <form id="empresaForm">
    <h3>Formulario Empresa</h3>
    <input type="text" placeholder="Nombre empresa" required>
    <input type="text" placeholder="Ubicación">
    <input type="text" placeholder="Puesto buscado">
    <textarea placeholder="Descripción"></textarea>
    <button type="submit">Enviar</button>
  </form>

  <!-- FORM TRABAJADOR -->
  <form id="trabajadorForm">
    <h3>Formulario Trabajador</h3>
    <input type="text" placeholder="Nombre" required>
    <input type="text" placeholder="Ubicación">
    <input type="text" placeholder="Experiencia">
    <textarea placeholder="Descripción"></textarea>
    <button type="submit">Enviar</button>
  </form>

</div>

<script>
  function mostrar(tipo) {
    document.getElementById("empresaForm").classList.remove("active");
    document.getElementById("trabajadorForm").classList.remove("active");

    if (tipo === "empresa") {
      document.getElementById("empresaForm").classList.add("active");
    } else {
      document.getElementById("trabajadorForm").classList.add("active");
    }
  }
</script>

</body>
</html>
