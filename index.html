<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto empresa Javi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
body {margin:0;font-family:system-ui;background:#f9fafb;}

.hero {min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:40px;background:
linear-gradient(rgba(15,23,42,.75),rgba(15,23,42,.85)),
url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
background-size:cover;}

.hero-buttons {display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}

.btn {padding:16px 30px;border-radius:14px;border:none;font-weight:600;cursor:pointer;}
.btn-worker {background:#6366f1;color:white;}
.btn-company {background:white;color:#111827;}

.map-section {max-width:1200px;margin:-80px auto 80px;background:white;border-radius:24px;padding:40px;box-shadow:0 30px 60px rgba(0,0,0,.1);}

#map {height:540px;border-radius:18px;}

.filters {margin-bottom:30px;display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}
.filters input,.filters select {padding:10px;border-radius:8px;border:1px solid #ddd;}

.hidden {display:none;}

.bubble {background:#6366f1;color:white;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.cluster-bubble {background:#4338ca;color:white;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;}
</style>
</head>

<body>

<section class="hero">
<div>
<h1>El talento que necesitas,<br>justo donde lo necesitas</h1>
<p>Consulta cuántas personas hay disponibles por provincia y población</p>

<div class="hero-buttons">
<button class="btn btn-worker">Registrarme</button>
<button class="btn btn-worker">Ya estoy inscrito</button>
<button class="btn btn-company">Soy empresa</button>
</div>
</div>
</section>

<section class="map-section">

<!-- FILTROS -->
<div class="filters">
<select id="categoria">
<option>Categoria profesional</option>
<option>Camarero</option>
<option>Cocinero</option>
<option>Recepcionista</option>
</select>

<input type="text" placeholder="Provincia">
<input type="text" placeholder="Población">

<input type="date" id="fechaInicio">
<input type="date" id="fechaFin">

<select id="tipoJornada">
<option value="">Tipo jornada</option>
<option value="completa">Completa</option>
<option value="unica">Única</option>
<option value="partida">Partida</option>
</select>

<div id="horarios" class="hidden">
<input type="time" id="horaInicio" placeholder="Inicio">
<input type="time" id="horaFin" placeholder="Fin">

<div id="horarioPartido" class="hidden">
<input type="time" id="horaInicio2" placeholder="Inicio tarde">
<input type="time" id="horaFin2" placeholder="Fin tarde">
</div>
</div>

</div>

<h2 style="text-align:center;">Talento disponible en España</h2>

<div id="map"></div>

</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
// MAPA (INTACTO)
const map = L.map("map").setView([40.4,-3.7],6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const populationLayer = L.markerClusterGroup();

const populations = [
["Madrid",40.4,-3.7,800],
["Barcelona",41.3,2.1,900],
["Valencia",39.4,-0.3,650]
];

populations.forEach(p=>{
const marker=L.marker([p[1],p[2]],{
personCount:p[3],
icon:L.divIcon({html:`<div class="bubble">${p[3]}</div>`})
});
populationLayer.addLayer(marker);
});

map.addLayer(populationLayer);


// FILTROS LOGICA
const tipo = document.getElementById("tipoJornada");
const horarios = document.getElementById("horarios");
const horarioPartido = document.getElementById("horarioPartido");

tipo.addEventListener("change",()=>{
horarios.classList.remove("hidden");
horarioPartido.classList.add("hidden");

if(tipo.value==="completa"){
horarios.classList.add("hidden");
}

if(tipo.value==="partida"){
horarioPartido.classList.remove("hidden");
}
});

// VALIDACION PARTIDA
document.getElementById("horaInicio2").addEventListener("change",()=>{
let mañanaFin = document.getElementById("horaFin").value;
let tardeInicio = document.getElementById("horaInicio2").value;

if(mañanaFin && tardeInicio && tardeInicio < mañanaFin){
alert("❌ El horario de tarde no puede ser anterior al de mañana");
document.getElementById("horaInicio2").value="";
}
});
</script>

</body>
</html>
