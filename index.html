<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body {
  font-family: Arial;
  background: #f1f5f9;
  padding: 20px;
}

.seccion {
  background: #ffffff;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
}

/* FORMULARIO */
.grid-form {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: span 4;
}

.form-group label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.form-group input, .form-group select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* DISPONIBILIDAD */
.semana {
  display: flex;
  gap: 10px;
}

.dia-card {
  background: #e0e7ff;
  border-radius: 12px;
  padding: 10px;
  width: 120px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.horas {
  display: flex;
  gap: 5px;
}

.horas input {
  width: 100%;
}

/* partida oculta por defecto */
.partida-horas {
  display: none;
}

.opciones-dia {
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* CV */
.upload-btn {
  display: inline-block;
  padding: 12px;
  border-radius: 10px;
  background: #f1f5f9;
  border: 1px dashed #94a3b8;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- DATOS PERSONALES -->
<div class="seccion">
  <h2>Datos personales</h2>

  <div class="grid-form">
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Apellidos *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Teléfono *</label>
      <input type="tel" required>
    </div>

    <div class="form-group">
      <label>Teléfono 2</label>
      <input type="tel">
    </div>

    <div class="form-group full">
      <label>Email *</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label>Provincia *</label>
      <select required>
        <option>Madrid</option>
        <option>Barcelona</option>
      </select>
    </div>

    <div class="form-group">
      <label>Población *</label>
      <select required>
        <option>Getafe</option>
        <option>Badalona</option>
      </select>
    </div>

    <div class="form-group">
      <label>€/hora *</label>
      <input type="number" required>
    </div>
  </div>
</div>

<!-- DISPONIBILIDAD -->
<div class="seccion">
  <h2>Disponibilidad</h2>

  <div class="semana" id="semana"></div>

</div>

<!-- INFO ADICIONAL -->
<div class="seccion">
  <h2>Información adicional</h2>

  <label class="upload-btn">
    <input type="file" hidden>
    📎 Adjuntar CV
  </label>

  <br><br>

  <textarea style="width:100%; height:100px; border-radius:10px;"></textarea>
</div>

<script>
// EMAIL validación mínima
document.getElementById('email').addEventListener('input', function () {
  if (!this.value.includes('@')) {
    this.setCustomValidity('Email inválido');
  } else {
    this.setCustomValidity('');
  }
});

// CREAR DÍAS
const dias = ["L","M","X","J","V","S","D"];
const semana = document.getElementById("semana");

dias.forEach(dia => {

  const card = document.createElement("div");
  card.className = "dia-card";

  card.innerHTML = `
    <strong>${dia}</strong>

    <div class="horas base-horas">
      <input type="time">
      <input type="time">
    </div>

    <div class="horas partida-horas">
      <input type="time">
      <input type="time">
    </div>

    <div class="opciones-dia">
      <label><input type="checkbox" class="partida"> Partida</label>
      <label><input type="checkbox" class="todo"> Todo el día</label>
    </div>
  `;

  semana.appendChild(card);

  const partida = card.querySelector(".partida");
  const todo = card.querySelector(".todo");
  const partidaHoras = card.querySelector(".partida-horas");
  const baseHoras = card.querySelector(".base-horas");

  // PARTIDA -> muestra 4 inputs
  partida.addEventListener("change", () => {
    if (partida.checked) {
      partidaHoras.style.display = "flex";
    } else {
      partidaHoras.style.display = "none";
    }
  });

  // TODO EL DÍA
  todo.addEventListener("change", () => {
    if (todo.checked) {
      baseHoras.style.display = "none";
      partidaHoras.style.display = "none";
      card.querySelector('.partida').closest('label').style.display = "none";
    } else {
      baseHoras.style.display = "flex";
      card.querySelector('.partida').closest('label').style.display = "block";

      if (partida.checked) {
        partidaHoras.style.display = "flex";
      }
    }
  });

});
</script>

</body>
</html>
