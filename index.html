<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body {
  font-family: Arial;
  background: #f1f5f9;
  padding: 20px;
}

/* SECCIONES */
.seccion {
  background: #ffffff;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
}

/* FORMULARIO */
.grid-form {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: span 4;
}

.form-group label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.form-group input {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}

/* AUTOCOMPLETE LISTA */
.lista {
  border: 1px solid #ccc;
  border-radius: 8px;
  max-height: 120px;
  overflow-y: auto;
  display: none;
  background: white;
  position: absolute;
  z-index: 10;
}

.lista div {
  padding: 8px;
  cursor: pointer;
}

.lista div:hover {
  background: #e2e8f0;
}

/* DISPONIBILIDAD */
.semana {
  display: flex;
  gap: 12px;
}

.dia-card {
  background: #e0e7ff;
  border-radius: 14px;
  padding: 12px;
  width: 150px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dia-card strong {
  text-align: center;
}

.horas {
  display: flex;
  gap: 6px;
}

.horas input {
  width: 100%;
  padding: 8px;
}

/* partida oculta */
.partida-horas {
  display: none;
}

.opciones-dia {
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* CV */
.upload-btn {
  display: inline-block;
  padding: 12px;
  border-radius: 10px;
  background: #f1f5f9;
  border: 1px dashed #94a3b8;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- DATOS -->
<div class="seccion">
  <h2>Datos personales</h2>

  <div class="grid-form">

    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Apellidos *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Teléfono *</label>
      <input type="tel" required>
    </div>

    <div class="form-group">
      <label>Teléfono 2</label>
      <input type="tel">
    </div>

    <div class="form-group full">
      <label>Email *</label>
      <input type="email" id="email" required>
    </div>

    <!-- PROVINCIA AUTOCOMPLETE -->
    <div class="form-group" style="position: relative;">
      <label>Provincia *</label>
      <input type="text" id="provincia">
      <div class="lista" id="listaProvincia"></div>
    </div>

    <!-- POBLACIÓN AUTOCOMPLETE -->
    <div class="form-group" style="position: relative;">
      <label>Población *</label>
      <input type="text" id="poblacion">
      <div class="lista" id="listaPoblacion"></div>
    </div>

    <div class="form-group">
      <label>€/hora *</label>
      <input type="number" required>
    </div>

  </div>
</div>

<!-- DISPONIBILIDAD -->
<div class="seccion">
  <h2>Disponibilidad</h2>
  <div class="semana" id="semana"></div>
</div>

<!-- INFO -->
<div class="seccion">
  <h2>Información adicional</h2>

  <label class="upload-btn">
    <input type="file" hidden>
    📎 Adjuntar CV
  </label>

  <br><br>

  <textarea style="width:100%; height:100px; border-radius:10px;"></textarea>
</div>

<script>
// EMAIL
document.getElementById('email').addEventListener('input', function () {
  if (!this.value.includes('@')) {
    this.setCustomValidity('Email inválido');
  } else {
    this.setCustomValidity('');
  }
});

// AUTOCOMPLETE
const provincias = ["Barcelona","Madrid","Valencia"];
const poblaciones = ["Badalona","Getafe","Mataró"];

function activarAutocomplete(inputId, listaId, datos) {
  const input = document.getElementById(inputId);
  const lista = document.getElementById(listaId);

  input.addEventListener("input", () => {
    const valor = input.value.toLowerCase();
    lista.innerHTML = "";

    const filtrados = datos.filter(d => d.toLowerCase().includes(valor));

    if (valor && filtrados.length) {
      lista.style.display = "block";
      filtrados.forEach(item => {
        const div = document.createElement("div");
        div.textContent = item;
        div.onclick = () => {
          input.value = item;
          lista.style.display = "none";
        };
        lista.appendChild(div);
      });
    } else {
      lista.style.display = "none";
    }
  });

  document.addEventListener("click", (e) => {
    if (!input.contains(e.target)) {
      lista.style.display = "none";
    }
  });
}

activarAutocomplete("provincia", "listaProvincia", provincias);
activarAutocomplete("poblacion", "listaPoblacion", poblaciones);

// DÍAS COMPLETOS
const dias = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const semana = document.getElementById("semana");

dias.forEach(dia => {

  const card = document.createElement("div");
  card.className = "dia-card";

  card.innerHTML = `
    <strong>${dia}</strong>

    <div class="horas base">
      <input type="time">
      <input type="time">
    </div>

    <div class="horas partida-horas">
      <input type="time">
      <input type="time">
    </div>

    <div class="opciones-dia">
      <label><input type="checkbox" class="partida"> Partida</label>
      <label><input type="checkbox" class="todo"> Todo el día</label>
    </div>
  `;

  semana.appendChild(card);

  const partida = card.querySelector(".partida");
  const todo = card.querySelector(".todo");
  const partidaHoras = card.querySelector(".partida-horas");
  const base = card.querySelector(".base");

  partida.addEventListener("change", () => {
    partidaHoras.style.display = partida.checked ? "flex" : "none";
  });

  todo.addEventListener("change", () => {
    if (todo.checked) {
      base.style.display = "none";
      partidaHoras.style.display = "none";
      partida.closest('label').style.display = "none";
    } else {
      base.style.display = "flex";
      partida.closest('label').style.display = "block";
      if (partida.checked) partidaHoras.style.display = "flex";
    }
  });

});
</script>

</body>
</html>
``
