
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bloque 2 - Registro trabajador</title>

<style>
body {
  font-family: Arial;
  background: #f1f5f9;
  padding: 20px;
}

/* SECCIONES */
.seccion {
  background: #ffffff;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
}

/* FORMULARIO */
.grid-form {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: span 4;
}

.form-group label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.form-group input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.form-group input:focus {
  border-color: #3b82f6;
  outline: none;
}

/* ERROR */
.error-msg {
  display: none;
  color: red;
  font-size: 12px;
}

input:invalid + .error-msg {
  display: block;
}

/* DISPONIBILIDAD */
.semana {
  display: flex;
  gap: 10px;
}

.dia-card {
  background: #e0e7ff;
  border-radius: 12px;
  padding: 10px;
  width: 120px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.horas {
  display: flex;
  gap: 5px;
}

.horas input {
  width: 50%;
}

.opciones-dia {
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* CV */
.upload-btn {
  display: inline-block;
  padding: 12px 18px;
  border-radius: 10px;
  background: #f1f5f9;
  border: 1px dashed #94a3b8;
  cursor: pointer;
}

.upload-btn:hover {
  background: #e2e8f0;
}
</style>
</head>

<body>

<!-- DATOS PERSONALES -->
<div class="seccion">
  <h2>Datos personales</h2>

  <div class="grid-form">
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Apellidos *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Teléfono *</label>
      <input type="tel" required>
    </div>

    <div class="form-group">
      <label>Teléfono 2</label>
      <input type="tel">
    </div>

    <div class="form-group full">
      <label>Email *</label>
      <input type="email" id="email" required>
      <small class="error-msg">Introduce un email válido</small>
    </div>

    <div class="form-group">
      <label>Provincia *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>Población *</label>
      <input type="text" required>
    </div>

    <div class="form-group">
      <label>€/hora *</label>
      <input type="number" required>
    </div>
  </div>
</div>

<!-- DISPONIBILIDAD -->
<div class="seccion">
  <h2>Disponibilidad</h2>

  <div class="semana">

    <!-- DÍAS -->
    <script>
      const dias = ["L","M","X","J","V","S","D"];
      document.write(dias.map(d => `
        <div class="dia-card">
          <strong>${d}</strong>

          <div class="horas">
            <input type="time">
            <input type="time">
          </div>

          <div class="horas partida-container">
            <input type="time">
            <input type="time">
          </div>

          <div class="opciones-dia">
            <label><input type="checkbox" class="partida"> Partida</label>
            <label><input type="checkbox" class="todo-dia"> Todo el día</label>
          </div>
        </div>
      `).join(""));
    </script>

  </div>
</div>

<!-- INFO ADICIONAL -->
<div class="seccion">
  <h2>Información adicional</h2>

  <label class="upload-btn">
    <input type="file" hidden>
    📎 Adjuntar CV
  </label>

  <br><br>

  <textarea style="width:100%; height:100px; border-radius:10px; padding:10px;" placeholder="Descripción personal"></textarea>
</div>

<script>
// VALIDACIÓN EMAIL
document.getElementById('email').addEventListener('input', function () {
  if (!this.value.includes('@')) {
    this.setCustomValidity('Email inválido');
  } else {
    this.setCustomValidity('');
  }
});

// LÓGICA DISPONIBILIDAD
setTimeout(() => {
  document.querySelectorAll('.dia-card').forEach(card => {

    const todoDia = card.querySelector('.todo-dia');
    const partida = card.querySelector('.partida');
    const horas = card.querySelectorAll('.horas');

    todoDia.addEventListener('change', () => {
      if (todoDia.checked) {
        horas.forEach(h => h.style.display = 'none');
        partida.closest('label').style.display = 'none';
      } else {
        horas.forEach(h => h.style.display = 'flex');
        partida.closest('label').style.display = 'block';
      }
    });

  });
}, 100);
</script>

</body>
</html>
