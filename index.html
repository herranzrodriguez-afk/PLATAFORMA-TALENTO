
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto Empresa Javi</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f4f4;
}

header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 0;
}

.container {
    text-align: center;
    padding: 40px;
}

.buttons button {
    padding: 15px 25px;
    margin: 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.empresa {
    background: #0066ff;
    color: white;
}

.trabajador {
    background: #00aa55;
    color: white;
}

.mapa {
    margin: 40px auto;
    width: 300px;
}

.region {
    padding: 15px;
    margin: 5px;
    background: #ddd;
    cursor: pointer;
    border-radius: 6px;
}

.region:hover {
    background: #bbb;
}

form {
    display: none;
    margin-top: 30px;
}

input, textarea {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 300px;
}

.active {
    display: block;
}

.perfil {
    display: none;
}
</style>

</head>

<body>

<header>
    <h1>Plataforma de Talento - España</h1>
    <p>Conecta empresas con trabajadores</p>
</header>

<div class="container">

    <h2>Selecciona qué quieres hacer</h2>

    <div class="buttons">
        <button class="empresa" onclick="mostrarPerfil('empresa')">Soy Empresa</button>
        <button class="trabajador" onclick="mostrarPerfil('trabajador')">Busco Trabajo</button>
    </div>

    <!-- MAPA -->
    <div class="mapa">
        <h3>Selecciona zona</h3>

        <div class="region" onclick="seleccionarZona('Norte')">Norte</div>
        <div class="region" onclick="seleccionarZona('Centro')">Centro</div>
        <div class="region" onclick="seleccionarZona('Sur')">Sur</div>
        <div class="region" onclick="seleccionarZona('Levante')">Levante</div>
        <div class="region" onclick="seleccionarZona('Cataluña')">Cataluña</div>

        <p id="zonaSeleccionada"></p>
    </div>

    <!-- FORM EMPRESA -->
    <div class="perfil" id="empresaBox">
        <form id="empresaForm">
            <h3>Registro Empresa</h3>
            <input type="text" placeholder="Empresa" required>
            <input type="text" id="zonaEmpresa" placeholder="Zona">
            <input type="text" placeholder="Puesto buscado">
            <textarea placeholder="Descripción"></textarea>
            <button type="submit">Registrar Empresa</button>
        </form>
    </div>

    <!-- FORM TRABAJADOR -->
    <div class="perfil" id="trabajadorBox">
        <form id="trabajadorForm">
            <h3>Registro Trabajador</h3>
            <input type="text" placeholder="Nombre" required>
            <input type="text" id="zonaTrabajador" placeholder="Zona">
            <input type="text" placeholder="Experiencia">
            <textarea placeholder="Descripción"></textarea>
            <button type="submit">Registrarme</button>
        </form>
    </div>

</div>

<script>

let zonaGlobal = "";

function seleccionarZona(zona) {
    zonaGlobal = zona;
    document.getElementById("zonaSeleccionada").innerText = "Zona seleccionada: " + zona;

    document.getElementById("zonaEmpresa").value = zona;
    document.getElementById("zonaTrabajador").value = zona;
}

function mostrarPerfil(tipo) {
    document.getElementById("empresaBox").style.display = "none";
    document.getElementById("trabajadorBox").style.display = "none";

    if (tipo === "empresa") {
        document.getElementById("empresaBox").style.display = "block";
    } else {
        document.getElementById("trabajadorBox").style.display = "block";
    }
}

// Simulación envío formulario
document.getElementById("empresaForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Empresa registrada correctamente 🚀");
});

document.getElementById("trabajadorForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Perfil registrado correctamente ✅");
});

</script>

</body>
</html>
