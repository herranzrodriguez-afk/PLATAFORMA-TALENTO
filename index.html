
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Talento España</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
}

.hero {
    background-image: url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
    height:250px;
    background-size: cover;
    filter: brightness(0.6);
}

.card {
    background:white;
    width:80%;
    margin:-80px auto;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.kpis {
    display:flex;
    justify-content:center;
    gap:50px;
    margin:20px 0;
}

.kpis div {
    font-size:20px;
}

.kpis strong {
    display:block;
    font-size:30px;
    color:#4f46e5;
}

#map {
    height:500px;
    margin-top:20px;
    border-radius:15px;
}
</style>
</head>

<body>

<div class="hero"></div>

<div class="card">

<h2>Talento disponible en España</h2>
<p>Zoom general: provincias · Zoom detallado: poblaciones</p>

<div class="kpis">
    <div><strong>12.438</strong>Trabajadores</div>
    <div><strong>47</strong>Provincias</div>
    <div><strong>962</strong>Empresas</div>
</div>

<div id="map"></div>

</div>

<script>

var map = L.map('map').setView([40.4168, -3.7038], 6);

// Mapa base
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
}).addTo(map);

// Ejemplo burbujas
L.circle([40.4168, -3.7038], {
    radius: 30000,
    color:"blue"
}).addTo(map).bindPopup("Madrid: 1210 trabajadores");

L.circle([41.3851, 2.1734], {
    radius: 30000,
    color:"blue"
}).addTo(map).bindPopup("Barcelona: 1340 trabajadores");

L.circle([37.3891, -5.9845], {
    radius: 30000,
    color:"blue"
}).addTo(map).bindPopup("Sevilla: 970 trabajadores");

L.circle([39.4699, -0.3763], {
    radius: 20000,
    color:"blue"
}).addTo(map).bindPopup("Valencia: 650 trabajadores");

</script>

</body>
</html>
