<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto empresa Javi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
body {margin:0;font-family:system-ui;background:#f9fafb;}

.hero {min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:40px;
background:linear-gradient(rgba(15,23,42,.75),rgba(15,23,42,.85)),
url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
background-size:cover;}

.hero-buttons {display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}

.btn {padding:16px 30px;border-radius:14px;border:none;font-weight:600;cursor:pointer;}
.btn-worker {background:#6366f1;color:white;}
.btn-company {background:white;color:#111827;}

.map-section {max-width:1200px;margin:-80px auto 80px;background:white;border-radius:24px;padding:40px;box-shadow:0 30px 60px rgba(0,0,0,.1);}

.filters {margin-bottom:30px;text-align:center;}
.filters input,.filters select {margin:5px;padding:8px;border-radius:6px;}

.day-block {border:1px solid #ddd;padding:10px;margin:5px;border-radius:8px;}

.hidden {display:none;}

#map {height:540px;border-radius:18px;}

.bubble {background:#6366f1;color:white;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cluster-bubble {background:#4338ca;color:white;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
</style>
</head>

<body>

<section class="hero">
<div>
<h1>El talento que necesitas,<br>justo donde lo necesitas</h1>

<div class="hero-buttons">
<button class="btn btn-worker">Registrarme</button>
<button class="btn btn-worker">Ya estoy inscrito</button>
<button class="btn btn-company">Soy empresa</button>
</div>
</div>
</section>

<section class="map-section">

<div class="filters">

<select id="tipoJornada">
<option value="">Tipo jornada</option>
<option value="completa">Completa</option>
<option value="unica">Única</option>
<option value="partida">Partida</option>
</select>

<div id="semana"></div>

</div>

<div id="map"></div>

</section>

<!-- ✅ FIX SCRIPT -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>

// MAPA
const map = L.map("map").setView([40.4,-3.7],6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const populationLayer = L.markerClusterGroup({
maxClusterRadius:60,
iconCreateFunction: function(cluster){
let total=0;
cluster.getAllChildMarkers().forEach(m=> total+=m.options.personCount);
return L.divIcon({
html:`<div class="cluster-bubble">${total}</div>`,
className:""
});
}
});

// 🔥 MUCHOS DATOS
const populations = [

["Madrid",40.41,-3.7,200],
["Getafe",40.3,-3.7,150],
["Alcalá",40.48,-3.36,120],
["Leganés",40.33,-3.76,90],
["Móstoles",40.32,-3.86,110],
["Fuenlabrada",40.28,-3.8,80],
["Parla",40.23,-3.77,70],
["Alcorcón",40.35,-3.82,95],
["Coslada",40.42,-3.56,60],
["Sanse",40.54,-3.63,75],

["Barcelona",41.38,2.17,210],
["Hospitalet",41.36,2.11,140],
["Badalona",41.44,2.24,130],
["Terrassa",41.56,2.01,100],
["Sabadell",41.54,2.10,90],
["Mataró",41.54,2.44,85],
["Granollers",41.6,2.28,70],
["Castelldefels",41.28,1.97,60],
["Rubí",41.49,2.03,55],
["Sant Cugat",41.47,2.09,65]

];

populations.forEach(p=>{
const marker=L.marker([p[1],p[2]],{
personCount:p[3],
icon:L.divIcon({html:`<div class="bubble">${p[3]}</div>`,className:""})
}).bindPopup(`<b>${p[0]}</b><br>${p[3]} personas`);

populationLayer.addLayer(marker);
});

map.addLayer(populationLayer);


// 💥 FILTRO POR DÍAS
const tipo = document.getElementById("tipoJornada");
const semana = document.getElementById("semana");

const dias = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

tipo.addEventListener("change",()=>{

semana.innerHTML = "";

if(tipo.value==="completa") return;

dias.forEach(dia=>{
const div = document.createElement("div");
div.className="day-block";

let html = `<strong>${dia}</strong><br>`;

if(tipo.value==="unica"){
html += `Inicio <input type="time" class="inicio">
Fin <input type="time" class="fin">`;
}

if(tipo.value==="partida"){
html += `
Mañana <input type="time" class="inicio">
<input type="time" class="fin"><br>
Tarde <input type="time" class="inicio2">
<input type="time" class="fin2">
`;
}

div.innerHTML = html;
semana.appendChild(div);
});

// validación partida
setTimeout(()=>{
document.querySelectorAll(".inicio2").forEach(input=>{
input.addEventListener("change",(e)=>{
let block = e.target.closest(".day-block");
let finMañana = block.querySelector(".fin")?.value;
let inicioTarde = e.target.value;

if(finMañana && inicioTarde && inicioTarde < finMañana){
alert("❌ Tarde no puede empezar antes que termine la mañana");
e.target.value="";
}
});
});
},100);

});

</script>

</body>
</html>
