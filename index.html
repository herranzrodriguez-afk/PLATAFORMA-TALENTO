
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto empresa Javi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9fafb;
      color: #111827;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(15,23,42,.75), rgba(15,23,42,.85)),
        url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #e5e7eb;
      max-width: 760px;
      margin: 0 auto 32px;
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .btn {
      padding: 16px 30px;
      border-radius: 14px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-worker { background:#6366f1; color:white; }
    .btn-company { background:white; color:#111827; }

    /* FORM */
    .form-section {
      max-width: 900px;
      margin: 60px auto;
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,.1);
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      margin-top: 20px;
      display: block;
    }

    input, textarea, select {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
    }

    .checkbox-group, .days-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .checkbox-group label,
    .days-group label {
      font-weight: 500;
    }

    .submit-btn {
      margin-top: 30px;
      background: #6366f1;
      color: white;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>El talento que necesitas,<br>justo donde lo necesitas</h1>
    <p>Regístrate y empieza a recibir oportunidades de trabajo según tu disponibilidad y experiencia.</p>
    <div class="hero-buttons">
      <button class="btn btn-worker" onclick="document.getElementById('worker-form').scrollIntoView({behavior:'smooth'})">
        Soy trabajador
      </button>
      <button class="btn btn-company">Soy empresa</button>
    </div>
  </div>
</section>

<!-- FORMULARIO TRABAJADOR -->
<section class="form-section" id="worker-form">
  <h2>Inscripción de trabajador</h2>

  <label>Nombre *</label>
  <input type="text" required>

  <label>Apellidos *</label>
  <input type="text" required>

  <label>Teléfono *</label>
  <input type="tel" required>

  <label>Email *</label>
  <input type="email" required>

  <label>Disponibilidad semanal</label>
  <div class="days-group">
    <label><input type="checkbox"> Lunes</label>
    <label><input type="checkbox"> Martes</label>
    <label><input type="checkbox"> Miércoles</label>
    <label><input type="checkbox"> Jueves</label>
    <label><input type="checkbox"> Viernes</label>
    <label><input type="checkbox"> Sábado</label>
    <label><input type="checkbox"> Domingo</label>
  </div>

  <div class="checkbox-group">
    <label><input type="checkbox"> Mañana</label>
    <label><input type="checkbox"> Tarde</label>
    <label><input type="checkbox"> Noche</label>
    <label><input type="checkbox"> Jornada completa</label>
  </div>

  <label>Categorías de experiencia</label>
  <div class="checkbox-group">
    <label><input type="checkbox"> Hostelería</label>
    <label><input type="checkbox"> Eventos y promociones</label>
    <label><input type="checkbox"> Retail / Tienda</label>
    <label><input type="checkbox"> Logística</label>
    <label><input type="checkbox"> Atención al cliente</label>
    <label><input type="checkbox"> Otros</label>
  </div>

  <label>Idiomas</label>
  <div class="checkbox-group">
    <label><input type="checkbox"> Español</label>
    <label><input type="checkbox"> Inglés</label>
    <label><input type="checkbox"> Francés</label>
    <label><input type="checkbox"> Otros</label>
  </div>

  <label>Adjuntar CV</label>
  <input type="file" accept=".pdf,.doc,.docx,image/*">

  <label>Cuéntanos cómo eres como persona</label>
  <textarea rows="4" placeholder="Motivación, actitud, disponibilidad extra..."></textarea>

  <button class="submit-btn">Enviar inscripción</button>
</section>

<footer>
  © Proyecto empresa Javi · MVP
</footer>

</body>
</html>
