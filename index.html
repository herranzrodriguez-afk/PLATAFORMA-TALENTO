
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto empresa Javi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f9fafb;
      color: #111827;
    }

    /* ===== HOME ===== */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(15,23,42,.75), rgba(15,23,42,.85)),
        url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      max-width: 700px;
    }

    .btn {
      padding: 16px 30px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      margin: 10px;
    }

    .btn-worker { background:#6366f1; color:white; }
    .btn-company { background:white; color:#111827; }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 95%;
      max-width: 1200px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 40px;
      position: relative;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      margin-top: 20px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
    }

    /* ===== DISPONIBILIDAD ===== */
    .schedule {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
      margin-top: 30px;
    }

    .day {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .day strong {
      display: block;
      margin-bottom: 10px;
      background: #6366f1;
      color: white;
      padding: 6px;
      border-radius: 6px;
    }

    .day input {
      margin-bottom: 8px;
    }

    .submit {
      margin-top: 40px;
      width: 100%;
      padding: 18px;
      background: #6366f1;
      color: white;
      font-size: 1.1rem;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- HOME -->
<section class="hero">
  <div>
    <h1>El talento que necesitas,<br>justo donde lo necesitas</h1>
    <p>Regístrate y define tu disponibilidad semanal de forma clara y visual.</p>
    <button class="btn btn-worker" onclick="openModal()">Soy trabajador</button>
    <button class="btn btn-company">Soy empresa</button>
  </div>
</section>

<!-- MODAL TRABAJADOR -->
<div class="modal" id="workerModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✕</span>

    <h2>Inscripción de trabajador</h2>

    <label>Nombre</label>
    <input type="text">

    <label>Apellidos</label>
    <input type="text">

    <label>Teléfono</label>
    <input type="tel">

    <label>Email</label>
    <input type="email">

    <h3 style="margin-top:30px;">Disponibilidad semanal</h3>

    <div class="schedule">
      <div class="day"><strong>L</strong><input type="time"><input type="time"><label><input type="checkbox"> Partida</label></div>
      <div class="day"><strong>M</strong><input type="time"><input type="time"><label><input type="checkbox"> Partida</label></div>
      <div class="day"><strong>X</strong><input type="time"><input type="time"><label><input type="checkbox"> Partida</label></div>
      <div class="day"><strong>J</strong><input type="time"><input type="time"><label><input type="checkbox"> Partida</label></div>
      <div class="day"><strong>V</strong><input type="time"><input type="time"><label><input type="checkbox"> Partida</label></div>
      <div class="day"><strong>S</strong><input type="time"><input type="time"><label><input type="checkbox"> Partida</label></div>
      <div class="day"><strong>D</strong><input type="time"><input type="time"><label><input type="checkbox"> Partida</label></div>
    </div>

    <label style="margin-top:30px;">Adjuntar CV</label>
    <input type="file" accept=".pdf,.doc,.docx,image/*">

    <label>Cuéntanos cómo eres como persona</label>
    <textarea rows="4"></textarea>

    <button class="submit">Enviar inscripción</button>
  </div>
</div>

<script>
  function openModal() {
    document.getElementById("workerModal").classList.add("active");
  }
  function closeModal() {
    document.getElementById("workerModal").classList.remove("active");
  }
</script>

</body>
</html>
