
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plataforma de Talento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #ecfeff, #ecfdf5);
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #4338ca;
    }
    .card {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    input, textarea, select, button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
    button {
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Plataforma de Talento</h1>

<div class="card">
  <h2>👤 Registro de trabajadores</h2>
  <input placeholder="Nombre">
  <textarea placeholder="Experiencia profesional"></textarea>
  <select>
    <option>Días disponibles</option>
    <option>Lunes a Viernes</option>
    <option>Fines de semana</option>
    <option>Flexible</option>
  </select>
  <button>Registrarme</button>
</div>

</body>
</html>
