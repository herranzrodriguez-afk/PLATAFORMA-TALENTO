<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto empresa Javi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9fafb;
      color: #111827;
    }

    /* HERO ORIGINAL */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(15,23,42,.75), rgba(15,23,42,.85)),
        url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 5vw, 3.8rem);
      font-weight: 800;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #e5e7eb;
      max-width: 780px;
      margin: 0 auto 32px;
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 16px 30px;
      border-radius: 14px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    /* NUEVO BOTÓN (sin tocar originales) */
    .btn-register { background:#10b981; color:white; }
    .btn-worker { background:#6366f1; color:white; }
    .btn-company { background:white; color:#111827; }

    /* MAPA ORIGINAL */
    .map-section {
      max-width: 1200px;
      margin: -80px auto 80px;
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,.1);
    }

    .map-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .stat strong {
      font-size: 2rem;
      color: #4f46e5;
      display: block;
    }

    #map {
      height: 540px;
      border-radius: 18px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .bubble {
      background: #6366f1;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .cluster-bubble {
      background: #4338ca;
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    /* FILTROS (AÑADIDO) */
    .filtros {
      background: #f3f4f6;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 30px;
    }

    .fila {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .filtros input, .filtros select {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

<!-- HERO ORIGINAL -->
<section class="hero">
  <div>
    <h1>El talento que necesitas,<br>justo donde lo necesitas</h1>
    <p>Consulta cuántas personas hay disponibles por provincia y población en España.</p>

    <div class="hero-buttons">
      <!-- AÑADIDO -->
      <button class="btn btn-register" onclick="window.location.href='bloqueSoy empresa</button>
    </div>
  </div>
</section>

<!-- MAP SECTION ORIGINAL + FILTROS -->
<section class="map-section">

  <!-- FILTROS (AÑADIDO) -->
  <div class="filtros">
    <h3>Filtros</h3>

    <div class="fila">
      <select id="categoria">
        <option value="">Categoría profesional</option>
        <option>Camarero</option>
        <option>Cocinero</option>
        <option>Limpieza</option>
      </select>

      <input id="provincia" placeholder="Provincia">
      <input id="poblacion" placeholder="Población">
    </div>

    <div id="dias"></div>

    <div class="fila">
      <input id="precioMin" placeholder="€/h min" type="number">
      <input id="precioMax" placeholder="€/h max" type="number">
      <button onclick="filtrar()">Buscar</button>
    </div>
  </div>

  <!-- CONTENIDO ORIGINAL -->
  <div class="map-title">
    <h2>Talento disponible en España</h2>
    <p>Zoom general: provincias · Zoom detallado: poblaciones</p>
  </div>

  <div class="stats">
    <div class="stat"><strong>12.438</strong>Trabajadores</div>
    <div class="stat"><strong>47</strong>Provincias</div>
    <div class="stat"><strong>962</strong>Empresas</div>
  </div>

  <div id="map"></div>
</section>

<footer>
  © Proyecto empresa Javi · MVP
</footer>

<!-- JS ORIGINAL -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
  const map = L.map("map").setView([40.4, -3.7], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

  const populationLayer = L.markerClusterGroup({
    maxClusterRadius: 60,
    showCoverageOnHover: false,
    iconCreateFunction: function (cluster) {
      let total = 0;
      cluster.getAllChildMarkers().forEach(marker => {
        total += marker.options.personCount;
      });

      return L.divIcon({
        html: `<div class="cluster-bubble">${total}</div>`,
        className: "",
        iconSize: [56, 56]
      });
    }
  });

  /* DATOS ORIGINALES */
  const populations = [
    ["Madrid", 40.4168, -3.7038, 800],
    ["Barcelona", 41.3851, 2.1734, 900],
    ["Valencia", 39.4699, -0.3763, 650],
    ["Sevilla", 37.3891, -5.9845, 540]
  ];

  function pintar(data) {
    populationLayer.clearLayers();

    data.forEach(p => {
      const marker = L.marker([p[1], p[2]], {
        personCount: p[3],
        icon: L.divIcon({
          html: `<div class="bubble">${p[3]}</div>`,
          className: ""
        })
      });

      populationLayer.addLayer(marker);
    });

    map.addLayer(populationLayer);
  }

  pintar(populations);

  /* DISPONIBILIDAD (AÑADIDO) */
  const dias = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const cont = document.getElementById("dias");

  dias.forEach(d => {
    cont.innerHTML += `${d} <input type="time"> <input type="time"><br>`;
  });

  /* FILTROS (AÑADIDO) */
  function filtrar(){
    const provincia = document.getElementById("provincia").value.toLowerCase();
    const poblacion = document.getElementById("poblacion").value.toLowerCase();

    let data = populations;

    if(provincia){
      data = data.filter(p => p[0].toLowerCase().includes(provincia));
    }

    if(poblacion){
      data = data.filter(p => p[0].toLowerCase().includes(poblacion));
    }

    pintar(data);

    if(data.length > 0){
      map.setView([data[0][1], data[0][2]], 10);
    }
  }
</script>

</body>
</html>
