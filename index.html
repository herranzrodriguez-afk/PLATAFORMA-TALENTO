<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto empresa Javi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
body {margin:0;font-family:system-ui;background:#f9fafb;}

.hero {min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:40px;
background:linear-gradient(rgba(15,23,42,.75),rgba(15,23,42,.85)),
url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
background-size:cover;}

.hero-buttons {display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}

.btn {padding:16px 30px;border-radius:14px;border:none;font-weight:600;cursor:pointer;}
.btn-worker {background:#6366f1;color:white;}
.btn-company {background:white;color:#111827;}

.claim {margin-top:20px;font-size:1.2rem;color:#e5e7eb;}

.map-section {max-width:1200px;margin:-80px auto 80px;background:white;border-radius:24px;padding:40px;box-shadow:0 30px 60px rgba(0,0,0,.1);}

.filters {margin-bottom:25px;text-align:center;}
.filters input,.filters select {margin:5px;padding:8px;border-radius:6px;}

#buscarBtn{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:10px;
background:#4f46e5;
color:white;
font-weight:600;
cursor:pointer;
}

.week {display:grid;grid-template-columns:repeat(7,1fr);gap:15px;margin-top:20px;}

.day-card {background:#a5b4fc;padding:15px;border-radius:14px;text-align:center;min-height:260px;}
.day-card input {margin:5px 0;width:90%;padding:5px;border-radius:6px;border:none;}

.hidden {display:none;}

#map {height:540px;border-radius:18px;margin-top:30px;}

.bubble {background:#6366f1;color:white;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cluster-bubble {background:#4338ca;color:white;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;}

/* ✅ POPUP */
.overlay {
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.popup {
background:white;
width:70%;
max-width:700px;
padding:30px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,.3);
text-align:center;
}
</style>
</head>

<body>

<div id="overlay" class="overlay">
<div class="popup">
<h2>Resultados de búsqueda</h2>
<p>Vista futura de resultados</p>
<button onclick="closePopup()">Cerrar</button>
</div>
</div>

<section class="hero">
<div>
<h1>El talento que necesitas,<br>justo donde lo necesitas</h1>

<div class="hero-buttons">
<button class="btn btn-worker">Registrarme</button>
<button class="btn btn-worker">Ya estoy inscrito</button>
<button class="btn btn-company">Soy empresa</button>
</div>

<div class="claim">
Encuentra o sé el talento que mueve el trabajo real. Aquí empieza todo.
</div>

</div>
</section>

<section class="map-section">

<div class="filters">
<select id="categoria">
<option value="">Categoría profesional</option>
<option value="camarero">Camarero</option>
<option value="cocinero">Cocinero</option>
</select>

<input id="provincia" list="provincias" placeholder="Provincia">
<datalist id="provincias">
<option value="Madrid">
<option value="Barcelona">
</datalist>

<input id="poblacion" list="poblaciones" placeholder="Población">
<datalist id="poblaciones">
<option value="Madrid">
<option value="Getafe">
<option value="Alcalá de Henares">
<option value="Móstoles">
<option value="Leganés">
<option value="Barcelona">
<option value="Hospitalet">
<option value="Badalona">
<option value="Sabadell">
<option value="Terrassa">
</datalist>

<input type="date">
<input type="date">
<input id="precio" type="number" placeholder="€/hora">
</div>

<div class="week" id="week"></div>

<div style="text-align:center;">
<button id="buscarBtn">BUSCAR</button>
</div>

<div id="map"></div>

</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>

const allData = [
{prov:"Madrid", city:"Madrid", lat:40.41, lng:-3.7, price:10, people:120, availability:["Lunes"]},
{prov:"Madrid", city:"Getafe", lat:40.3, lng:-3.7, price:9, people:80, availability:["Martes"]},
{prov:"Madrid", city:"Alcalá de Henares", lat:40.48, lng:-3.36, price:11, people:70, availability:["Miércoles"]},
{prov:"Madrid", city:"Móstoles", lat:40.32, lng:-3.86, price:10, people:60, availability:["Jueves"]},
{prov:"Madrid", city:"Leganés", lat:40.33, lng:-3.76, price:8, people:50, availability:["Viernes"]},

{prov:"Barcelona", city:"Barcelona", lat:41.38, lng:2.17, price:12, people:130, availability:["Lunes"]},
{prov:"Barcelona", city:"Hospitalet", lat:41.36, lng:2.11, price:10, people:90, availability:["Martes"]},
{prov:"Barcelona", city:"Badalona", lat:41.44, lng:2.24, price:9, people:80, availability:["Miércoles"]},
{prov:"Barcelona", city:"Sabadell", lat:41.54, lng:2.10, price:11, people:70, availability:["Jueves"]},
{prov:"Barcelona", city:"Terrassa", lat:41.56, lng:2.01, price:10, people:60, availability:["Viernes"]}
];

// MAPA igual
const map = L.map("map").setView([40.4,-3.7],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const populationLayer = L.markerClusterGroup({
maxClusterRadius:60,
iconCreateFunction: function(cluster){
let total=0;
cluster.getAllChildMarkers().forEach(m=>{
total += m.options.personCount;
});
return L.divIcon({html:`<div class="cluster-bubble">${total}</div>`,className:""});
}
});

map.addLayer(populationLayer);

function applyFilters(){

const prov = document.getElementById("provincia").value.toLowerCase();
const pob = document.getElementById("poblacion").value.toLowerCase();
const precio = document.getElementById("precio").value;

let filtered = allData.filter(d=>{
if(prov && d.prov.toLowerCase() !== prov) return false;
if(pob && !d.city.toLowerCase().includes(pob)) return false;
if(precio && d.price > parseInt(precio)) return false;
return true;
});

populationLayer.clearLayers();

const bounds=[];

filtered.forEach(d=>{
const marker=L.marker([d.lat,d.lng],{
personCount:d.people,
icon:L.divIcon({html:`<div class="bubble">${d.people}</div>`})
});

populationLayer.addLayer(marker);
bounds.push([d.lat,d.lng]);
});

if(bounds.length>0){
map.fitBounds(bounds,{padding:[50,50]});
}else{
map.setView([40.4,-3.7],6);
}

}

// popup
document.getElementById("buscarBtn").addEventListener("click", ()=>{
applyFilters();
document.getElementById("overlay").style.display="flex";
});

function closePopup(){
document.getElementById("overlay").style.display="none";
}

// inicial
applyFilters();

</script>

</body>
</html>
