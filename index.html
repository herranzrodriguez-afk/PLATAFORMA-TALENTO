<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto empresa Javi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
body {margin:0;font-family:system-ui;background:#f9fafb;}

.hero {min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:40px;
background:linear-gradient(rgba(15,23,42,.75),rgba(15,23,42,.85)),
url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
background-size:cover;}

.hero-buttons {display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}

.btn {padding:16px 30px;border-radius:14px;border:none;font-weight:600;cursor:pointer;}
.btn-worker {background:#6366f1;color:white;}
.btn-company {background:white;color:#111827;}

.map-section {max-width:1200px;margin:-80px auto 80px;background:white;border-radius:24px;padding:40px;box-shadow:0 30px 60px rgba(0,0,0,.1);}

.filters {margin-bottom:25px;text-align:center;}
.filters input,.filters select {margin:5px;padding:8px;border-radius:6px;}

#buscarBtn{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:10px;
background:#4f46e5;
color:white;
font-weight:600;
cursor:pointer;
}

.week {
display:grid;
grid-template-columns: repeat(7, 1fr);
gap:15px;
margin-top:20px;
}

.day-card {
background:#a5b4fc;
padding:15px;
border-radius:14px;
text-align:center;
min-height:260px;
}

.day-card input {margin:5px 0;width:90%;padding:5px;border-radius:6px;border:none;}

.hidden {display:none;}

#map {
height:540px;
border-radius:18px;
margin-top:30px;
}

.bubble {background:#6366f1;color:white;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cluster-bubble {background:#4338ca;color:white;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;}
</style>
</head>

<body>

<section class="hero">
<div>
<h1>El talento que necesitas,<br>justo donde lo necesitas</h1>
<div class="hero-buttons">
<button class="btn btn-worker">Registrarme</button>
<button class="btn btn-worker">Ya estoy inscrito</button>
<button class="btn btn-company">Soy empresa</button>
</div>
</div>
</section>

<section class="map-section">

<div class="filters">

<select>
<option>Categoria profesional</option>
<option>Camarero</option>
<option>Cocinero</option>
</select>

<input list="provincias" placeholder="Provincia">
<datalist id="provincias">
<option value="Madrid">
<option value="Barcelona">
</datalist>

<input list="poblaciones" placeholder="Población">
<datalist id="poblaciones">
<option value="Madrid">
<option value="Getafe">
<option value="Alcalá de Henares">
<option value="Móstoles">
<option value="Leganés">
<option value="Barcelona">
<option value="Hospitalet">
<option value="Badalona">
<option value="Sabadell">
<option value="Terrassa">
</datalist>

<input type="date">
<input type="date">

<!-- ✅ NUEVO -->
<input type="number" placeholder="€/hora">

</div>

<div class="week" id="week"></div>

<!-- ✅ BOTÓN BUSCAR -->
<div style="text-align:center;">
<button id="buscarBtn">BUSCAR</button>
</div>

<div id="map"></div>

</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>

// MAPA
const map = L.map("map").setView([40.4,-3.7],6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

const populationLayer = L.markerClusterGroup({
maxClusterRadius:60,

/* ✅ FIX CLUSTER TOTAL PERSONAS */
iconCreateFunction: function(cluster){
let total=0;
cluster.getAllChildMarkers().forEach(m=>{
total += m.options.personCount;
});

return L.divIcon({
html:`<div class="cluster-bubble">${total}</div>`,
className:""
});
}
});

const populations = [
["Madrid",40.41,-3.7,120],
["Getafe",40.3,-3.7,80],
["Alcalá",40.48,-3.36,70],
["Móstoles",40.32,-3.86,60],
["Leganés",40.33,-3.76,50],

["Barcelona",41.38,2.17,130],
["Hospitalet",41.36,2.11,90],
["Badalona",41.44,2.24,80],
["Sabadell",41.54,2.10,70],
["Terrassa",41.56,2.01,60]
];

populations.forEach(p=>{
const marker=L.marker([p[1],p[2]],{
personCount:p[3],
icon:L.divIcon({html:`<div class="bubble">${p[3]}</div>`})
});

populationLayer.addLayer(marker);
});

map.addLayer(populationLayer);


// HORARIOS (intacto)
const dias=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const week=document.getElementById("week");

dias.forEach(dia=>{
const card=document.createElement("div");
card.className="day-card";

card.innerHTML=`
<h4>${dia}</h4>
<input type="time">
<input type="time">
<label><input type="checkbox" class="partida"> Jornada partida</label><br>
<label><input type="checkbox" class="completo"> Todo el día</label>
<div class="tarde hidden">
<input type="time">
<input type="time">
</div>
`;

week.appendChild(card);

const partida=card.querySelector(".partida");
const completo=card.querySelector(".completo");
const tarde=card.querySelector(".tarde");

partida.addEventListener("change",()=>{
if(partida.checked){
completo.checked=false;
tarde.classList.remove("hidden");
}else{
tarde.classList.add("hidden");
}
});

completo.addEventListener("change",()=>{
if(completo.checked){
partida.checked=false;
tarde.classList.add("hidden");
}
});

});

</script>

</body>
</html>
