<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body {
  font-family: Arial;
  background: #f1f5f9;
  padding: 20px;
}

/* SECCIONES */
.seccion {
  background: #ffffff;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
}

/* FORMULARIO */
.grid-form {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  position: relative;
}

.form-group.full {
  grid-column: span 4;
}

.form-group input {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* AUTOCOMPLETE */
.lista {
  position: absolute;
  top: 100%;
  width: 100%;
  background: white;
  border: 1px solid #ccc;
  display: none;
  z-index: 10;
}

/* DISPONIBILIDAD */
.semana {
  display: flex;
  gap: 12px;
}

.dia-card {
  background: #c7d2fe; /* azul más sólido */
  border-radius: 16px;
  padding: 14px;
  width: 150px; /* CLAVE: ancho fijo correcto */
  display: flex;
  flex-direction: column;
  box-sizing: border-box; /* ✅ evita desbordes */
}

.dia-card strong {
  text-align: center;
  margin-bottom: 8px;
}

/* BLOQUES HORAS */
.horas {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
}

.horas input {
  width: 100%;
  box-sizing: border-box; /* ✅ CLAVE */
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #999;
}

/* PARTIDA */
.partida-horas {
  display: none;
  margin-top: 6px;
}

/* CHECKS */
.check {
  margin: 6px 0;
  font-size: 13px;
}

/* CV */
.upload-btn {
  padding: 12px;
  background: #f1f5f9;
  border: 1px dashed #94a3b8;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- DATOS -->
<div class="seccion">
  <h2>Datos personales</h2>

  <div class="grid-form">
    <div class="form-group"><input placeholder="Nombre" required></div>
    <div class="form-group"><input placeholder="Apellidos" required></div>
    <div class="form-group"><input placeholder="Teléfono" required></div>
    <div class="form-group"><input placeholder="Teléfono 2"></div>

    <div class="form-group full">
      <input id="email" placeholder="Email" required>
    </div>

    <div class="form-group">
      <input id="provincia" placeholder="Provincia">
      <div class="lista" id="listaProvincia"></div>
    </div>

    <div class="form-group">
      <input id="poblacion" placeholder="Población">
      <div class="lista" id="listaPoblacion"></div>
    </div>

    <div class="form-group">
      <input placeholder="€/hora" type="number">
    </div>
  </div>
</div>

<!-- DISPONIBILIDAD -->
<div class="seccion">
  <h2>Disponibilidad</h2>
  <div class="semana" id="semana"></div>
</div>

<!-- INFO -->
<div class="seccion">
  <h2>Información adicional</h2>

  <label class="upload-btn">
    <input type="file" hidden>
    📎 Adjuntar CV
  </label>

  <br><br>

  <textarea style="width:100%; height:100px; border-radius:10px;"></textarea>
</div>

<script>
// EMAIL
document.getElementById('email').addEventListener('input', function () {
  if (!this.value.includes('@')) {
    this.setCustomValidity('Email inválido');
  } else {
    this.setCustomValidity('');
  }
});

// AUTOCOMPLETE
function activarAutocomplete(inputId, listaId, datos) {
  const input = document.getElementById(inputId);
  const lista = document.getElementById(listaId);

  input.addEventListener("input", () => {
    const valor = input.value.toLowerCase();
    lista.innerHTML = "";

    const filtrados = datos.filter(d => d.toLowerCase().includes(valor));

    if (valor && filtrados.length) {
      lista.style.display = "block";
      filtrados.forEach(item => {
        const div = document.createElement("div");
        div.textContent = item;
        div.onclick = () => {
          input.value = item;
          lista.style.display = "none";
        };
        lista.appendChild(div);
      });
    } else {
      lista.style.display = "none";
    }
  });

  document.addEventListener("click", (e) => {
    if (!input.contains(e.target)) {
      lista.style.display = "none";
    }
  });
}

activarAutocomplete("provincia","listaProvincia",["Barcelona","Madrid"]);
activarAutocomplete("poblacion","listaPoblacion",["Badalona","Getafe"]);

// DÍAS
const dias = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const semana = document.getElementById("semana");

dias.forEach(dia => {

  const card = document.createElement("div");
  card.className = "dia-card";

  card.innerHTML = `
    <strong>${dia}</strong>

    <div class="horas base">
      <input type="time">
      <input type="time">
    </div>

    <label class="check">
      <input type="checkbox" class="partida"> Jornada partida
    </label>

    <div class="horas partida-horas">
      <input type="time">
      <input type="time">
    </div>

    <label class="check">
      <input type="checkbox" class="todo"> Todo el día
    </label>
  `;

  semana.appendChild(card);

  const partida = card.querySelector(".partida");
  const todo = card.querySelector(".todo");
  const partidaHoras = card.querySelector(".partida-horas");
  const base = card.querySelector(".base");

  partida.addEventListener("change", () => {
    partidaHoras.style.display = partida.checked ? "block" : "none";
  });

  todo.addEventListener("change", () => {
    if (todo.checked) {
      base.style.display = "none";
      partidaHoras.style.display = "none";
      partida.closest('label').style.display = "none";
    } else {
      base.style.display = "block";
      partida.closest('label').style.display = "block";
      if (partida.checked) partidaHoras.style.display = "block";
    }
  });

});
</script>

</body>
</html>
``
