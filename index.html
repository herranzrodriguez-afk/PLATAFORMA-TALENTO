
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto empresa Javi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9fafb;
      color: #111827;
    }

    /* HERO */
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(15,23,42,.75), rgba(15,23,42,.85)),
        url("https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 5vw, 3.8rem);
      font-weight: 800;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.2rem;
      color: #e5e7eb;
      max-width: 780px;
      margin: 0 auto 32px;
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 16px 30px;
      border-radius: 14px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-worker { background:#6366f1; color:white; }
    .btn-company { background:white; color:#111827; }

    /* MAP */
    .map-section {
      max-width: 1200px;
      margin: -80px auto 80px;
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,.1);
    }

    .map-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .stat strong {
      font-size: 2rem;
      color: #4f46e5;
      display: block;
    }

    #map {
      height: 540px;
      border-radius: 18px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    /* Custom number bubble */
    .bubble {
      background: #6366f1;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
  </style>
</head>

<body>

<section class="hero">
  <div>
    <h1>El talento que necesitas,<br>justo donde lo necesitas</h1>
    <p>Visualiza cuántas personas hay disponibles por provincia y población en España.</p>
    <div class="hero-buttons">
      <button class="btn btn-worker">Soy trabajador</button>
      <button class="btn btn-company">Soy empresa</button>
    </div>
  </div>
</section>

<section class="map-section">
  <div class="map-title">
    <h2>Talento disponible en España</h2>
    <p>Zoom general: provincias · Zoom detallado: poblaciones</p>
  </div>

  <div class="stats">
    <div class="stat"><strong>12.438</strong>Trabajadores</div>
    <div class="stat"><strong>47</strong>Provincias</div>
    <div class="stat"><strong>962</strong>Empresas</div>
  </div>

  <div id="map"></div>
</section>

<footer>
  © Proyecto empresa Javi · MVP
</footer>

<!-- JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
  const map = L.map("map").setView([40.4, -3.7], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  /* === CAPA PROVINCIAS === */
  const provinceLayer = L.layerGroup();

  const provinces = [
    ["Madrid", 40.4168, -3.7038, 1410],
    ["Barcelona", 41.3851, 2.1734, 1340],
    ["Valencia", 39.4699, -0.3763, 1020],
    ["Sevilla", 37.3891, -5.9845, 720],
    ["Málaga", 36.7213, -4.4214, 580],
    ["Bizkaia", 43.2630, -2.9350, 420],
    ["A Coruña", 43.3623, -8.4115, 460]
  ];

  provinces.forEach(p => {
    provinceLayer.addLayer(
      L.marker([p[1], p[2]], {
        icon: L.divIcon({
          html: `<div class="bubble">${p[3]}</div>`
        })
      }).bindPopup(`<strong>${p[0]}</strong><br>${p[3]} candidatos`)
    );
  });

  map.addLayer(provinceLayer);

  /* === CAPA POBLACIONES === */
  const populationLayer = L.markerClusterGroup({
    maxClusterRadius: 60,
    showCoverageOnHover: false
  });

  const populations = [
    ["Madrid", 40.4168, -3.7038, 800],
    ["Alcalá de Henares", 40.4818, -3.3641, 220],
    ["Getafe", 40.3083, -3.7329, 190],

    ["Barcelona", 41.3851, 2.1734, 900],
    ["Hospitalet", 41.3662, 2.1167, 260],
    ["Badalona", 41.4469, 2.2450, 180],

    ["Valencia", 39.4699, -0.3763, 650],
    ["Torrent", 39.4370, -0.4655, 370],

    ["Sevilla", 37.3891, -5.9845, 540],
    ["Dos Hermanas", 37.2836, -5.9221, 180],

    ["Málaga", 36.7213, -4.4214, 430],
    ["Marbella", 36.5101, -4.8824, 150]
  ];

  populations.forEach(p => {
    populationLayer.addLayer(
      L.marker([p[1], p[2]], {
        icon: L.divIcon({
          html: `<div class="bubble">${p[3]}</div>`
        })
      }).bindPopup(`<strong>${p[0]}</strong><br>${p[3]} candidatos`)
    );
  });

  function updateLayers() {
    const zoom = map.getZoom();

    if (zoom <= 6) {
      map.addLayer(provinceLayer);
      map.removeLayer(populationLayer);
    } else {
      map.removeLayer(provinceLayer);
      map.addLayer(populationLayer);
    }
  }

  updateLayers();
  map.on("zoomend", updateLayers);
</script>

</body>
</html>
