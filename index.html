<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #f9fafb;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(rgba(15,23,42,.8), rgba(15,23,42,.9));
}

.btn {
  padding:16px 28px;
  border-radius:12px;
  border:none;
  background:#6366f1;
  color:white;
  cursor:pointer;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  width: 95%;
  max-width: 1100px;
  max-height: 90vh;
  overflow: auto;
  border-radius: 20px;
  padding: 30px;
  position: relative;
}

.close {
  position: absolute;
  right: 20px;
  top: 15px;
  cursor: pointer;
}

/* BLOQUES */
.card {
  background:#f9fafb;
  padding:20px;
  border-radius:16px;
  margin-bottom:25px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap:15px;
}

input, textarea {
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  width:100%;
}

/* DISPONIBILIDAD */
.schedule {
  display:grid;
  grid-template-columns: repeat(7,1fr);
  gap:10px;
}

.day {
  background:#eef2ff;
  padding:10px;
  border-radius:10px;
}

.day strong {
  display:block;
  background:#6366f1;
  color:white;
  text-align:center;
  border-radius:6px;
  margin-bottom:6px;
  
<script>
function openModal() {
  document.getElementById("workerModal").classList.add("active");
}

function closeModal() {
  document.getElementById("workerModal").classList.remove("active");
}

/* GENERAR 7 DÍAS AUTOMÁTICOS */
const days = ["L","M","X","J","V","S","D"];
const schedule = document.getElementById("schedule");

days.forEach(d => {
  const div = document.createElement("div");
  div.className = "day";

  div.innerHTML = `
    <strong>${d}</strong>
    <input type="time">
    <input type="time">
    <label><input type="checkbox"> Partida</label>
    <label><input type="checkbox"> Todo el día</label>
  `;

  schedule.appendChild(div);
});
</script>

</body>
</html>
